name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk codeagent-phone-assistant.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codeagent-phone-assistant
          path: codeagent-phone-assistant.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone-assistant-latest --cleanup-tag --yes || true
          gh release create phone-assistant-latest codeagent-phone-assistant.apk --title "CodeAgent Phone Assistant" --notes "Latest installable Android APK." --latest
