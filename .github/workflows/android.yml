name: Android Build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
  pull_request:

permissions:
  contents: write

concurrency:
  group: codeagent-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk codeagent-phone-assistant-v1.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codeagent-phone-assistant-v1.2.0
          path: codeagent-phone-assistant-v1.2.0.apk
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete phone-assistant-v1.2.0 --cleanup-tag --yes || true
          gh release create phone-assistant-v1.2.0 codeagent-phone-assistant-v1.2.0.apk --title "CodeAgent Phone Assistant 1.2.0" --notes "Qwen3 1.7B INT4, GPU-first local inference and multi-step phone agent loop." --latest
